<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wetwire: The Cold Archive</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#e6e3f0;--fg:#17142b;--pn:#f8f7fc;--ln:#c4bedb;--a:#b8006f;--b:#006f8c}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#05050d;--fg:#e4e1f5;--pn:#0d0b1c;--ln:#2a2450;--a:#ff2e93;--b:#2ee6ff}}
:root[data-theme="dark"]{--bg:#05050d;--fg:#e4e1f5;--pn:#0d0b1c;--ln:#2a2450;--a:#ff2e93;--b:#2ee6ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 'Chakra Petch',ui-sans-serif,system-ui,sans-serif}
main{max-width:740px;margin:0 auto;padding:10px}
h1{font-size:18px;margin:0 0 6px;font-weight:600}
h1 span{color:var(--a)}
#hud{display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:8px;font-size:12px}
.st{display:flex;align-items:center;gap:5px}
.bar{width:64px;height:7px;background:var(--ln);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%}
.pip{display:inline-block;width:9px;height:9px;margin-right:2px;background:var(--ln)}
.pip.on{background:var(--b)}
.pip.hp.on{background:var(--a)}
.pip.ht.on{background:#ffb020}
#wrap{position:relative}
canvas{display:block;width:100%;height:auto;background:#05050d;border:1px solid var(--ln);touch-action:manipulation}
#ov{position:absolute;inset:0;background:rgba(5,5,13,.93);color:#e4e1f5;padding:16px;overflow:auto;display:none}
#ov h2{margin:0 0 6px;font-size:22px;color:#ff2e93}
#ov p{margin:6px 0;max-width:60ch}
.cards{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.card{flex:1 1 240px;border:1px solid #2ee6ff;padding:10px}
.card b{color:#2ee6ff}
#acts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
button{font:inherit;background:var(--pn);color:var(--fg);border:1px solid var(--ln);padding:8px 11px;cursor:pointer;min-height:40px}
button:focus-visible{outline:2px solid var(--b);outline-offset:1px}
button.on{border-color:var(--b);box-shadow:inset 0 0 0 1px var(--b)}
button:disabled{opacity:.4;cursor:default}
#ov button{background:#0d0b1c;color:#e4e1f5;border-color:#ff2e93;margin:4px 6px 0 0}
#log{font-size:12px;min-height:76px;border-left:2px solid var(--a);padding-left:8px}
#log div:first-child{color:var(--b)}
small{opacity:.7}
</style></head><body><main>
<h1>Wetwire <span>/</span> The Cold Archive</h1>
<div id="hud"></div>
<div id="wrap"><canvas id="cv" width="704" height="480"></canvas><div id="ov"></div></div>
<div id="acts"></div>
<div id="log"></div>
<small>Click a tile to move. Unspent AP banks, max 5. Arrow keys or WASD step once; space ends your turn. Guards' cones are what they can see, not what they'll forgive.</small>
</main>
<script>
const T=32,W=22,H=15,DIRS=[[1,0],[0,1],[-1,0],[0,-1]];
const MAP=["######################","#S.....#.....#.......#","#......+.c...+...c...#","#.c....#.....#.......#","#......#..c..#...c...#","###+####..#####.######","#.....c......c.......#","#....................#","#..c..........c......#","#########V############","########.....#########","########.....#########","########.....#########","######################","######################"];
const B={net:{n:'Ghostwire, netrunner',hp:5,ar:0,hum:74,bat:100,rg:6,acc:.65,dmg:2,noise:3,st:2,ch:0,hack:1},
solo:{n:'Iron Lung, solo',hp:8,ar:1,hum:58,bat:60,rg:8,acc:.75,dmg:3,noise:10,st:0,ch:1,hack:0}};
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),ov=document.getElementById('ov');
let b,map,P,guards,cams,items,doors,turn,ap,mode,heat,logs,vis,seen,over,core,jack,cd,lockT,spawned,vaultOpen,eddies,optics,hum,bat,busy,rch,h2,flash=0;
const rain=Array.from({length:70},()=>({x:Math.random()*704,y:Math.random()*480,s:6+Math.random()*6}));
let fx=[],shake=0,sd=0;
const rb=(x,y)=>{for(let i=0;i<3;i++)fx.push({t:'gh',x:x*T+16,y:y*T+16,l:55,m:55,h:Math.random()*360,o:(Math.random()-.5)*10})};
const spark=(x,y,c,n)=>{for(let i=0;i<n;i++){const a=Math.random()*6.28,v=1+Math.random()*3.5;fx.push({t:'sp',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:24,m:24,c})}};
const tracer=(x0,y0,x1,y1,c)=>fx.push({t:'tr',x:x0*T+16,y:y0*T+16,x1:x1*T+16,y1:y1*T+16,l:12,m:12,c});
const slash=(x,y)=>fx.push({t:'sl',x:x*T+16,y:y*T+16,l:16,m:16});
const num=(x,y,s,c)=>fx.push({t:'tx',x:x*T+16,y:y*T+4,l:45,m:45,s,c});
const G=(x,y,d,path)=>({x,y,d,path,pi:1,hp:5,mx:5,st:0,tgt:null,sus:0,stun:0,cone:[]});
const dirOf=(dx,dy)=>Math.abs(dx)>=Math.abs(dy)?(dx>0?0:2):(dy>0?1:3);
const say=t=>{logs.unshift(t);logs=logs.slice(0,5)};
const opaque=(x,y)=>{const t=map[y][x];return t==='#'||t==='V'||(t==='+'&&!doors[x+','+y])};
function los(x0,y0,x1,y1){let dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,e=dx-dy,x=x0,y=y0;
 while(!(x===x1&&y===y1)){const e2=2*e;if(e2>-dy){e-=dy;x+=sx}if(e2<dx){e+=dx;y+=sy}
  if(x===x1&&y===y1)break;if(opaque(x,y))return false}return true}
function inView(sx,sy,f,tx,ty,r){const dx=tx-sx,dy=ty-sy,d=Math.hypot(dx,dy);if(d>r)return false;if(d===0)return true;
 if((dx*f[0]+dy*f[1])/(d*Math.hypot(f[0],f[1]))<.6)return false;return los(sx,sy,tx,ty)}
const detRange=()=>Math.max(2,6-b.st+b.ch);
const guardAt=(x,y)=>guards.find(g=>g.hp>0&&g.x===x&&g.y===y);
const pass=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&!'#cV'.includes(map[y][x])&&!guardAt(x,y);
function findPath(sx,sy,tx,ty){const par={[sx+','+sy]:null},q=[[sx,sy]];
 while(q.length){const[x,y]=q.shift();if(x===tx&&y===ty)break;
  for(const[dx,dy]of DIRS){const nx=x+dx,ny=y+dy,k=nx+','+ny;if(nx<0||ny<0||nx>=W||ny>=H||par[k]!==undefined)continue;
   if(!(nx===tx&&ny===ty)&&!(pass(nx,ny)&&!(nx===P.x&&ny===P.y)))continue;par[k]=[x,y];q.push([nx,ny])}}
 if(par[tx+','+ty]===undefined)return null;const p=[];let c=[tx,ty];
 while(c&&!(c[0]===sx&&c[1]===sy)){p.unshift(c);c=par[c[0]+','+c[1]]}return p}
function reach(){const D={[P.x+','+P.y]:0},q=[[P.x,P.y]];
 while(q.length){const[x,y]=q.shift(),d=D[x+','+y];if(d>=(sd>0?sd:ap))continue;
  for(const[dx,dy]of DIRS){const nx=x+dx,ny=y+dy,k=nx+','+ny;if(D[k]===undefined&&pass(nx,ny)){D[k]=d+1;q.push([nx,ny])}}}return D}
function cone(sx,sy,f,r,out){for(let y=Math.max(0,sy-r|0);y<=Math.min(H-1,sy+r);y++)for(let x=Math.max(0,sx-r|0);x<=Math.min(W-1,sx+r);x++)
 if(map[y][x]!=='#'&&inView(sx,sy,f,x,y,r))out.push([x,y])}
function recalc(){vis=[];for(let y=0;y<H;y++){vis[y]=[];for(let x=0;x<W;x++){const v=Math.hypot(x-P.x,y-P.y)<=9&&los(P.x,P.y,x,y);vis[y][x]=v;if(v)seen[y][x]=1}}
 for(const g of guards){g.cone=[];if(g.hp>0&&g.stun<=0)cone(g.x,g.y,DIRS[g.d],g.st===2?8:detRange(),g.cone)}
 for(const c of cams){c.cone=[];if(c.off<=0)cone(c.x,c.y,c.v[c.i],8,c.cone)}
 rch=mode==='move'&&(ap>0||sd>0)&&!busy?reach():{}}
const alertLv=()=>lockT>0||spawned?3:guards.some(g=>g.hp>0&&g.st===2)?2:guards.some(g=>g.hp>0&&g.st===1)?1:0;
function noise(x,y,r){let h=0;for(const g of guards){if(g.hp<=0||g.stun>0||Math.hypot(g.x-x,g.y-y)>r)continue;
 if(g.st<2){g.st=1;g.sus=5;h=1}g.tgt={x,y};g.d=dirOf(x-g.x,y-g.y)}if(h)say('Noise. Boots turn toward it.')}
const covered=(tx,ty,sx,sy)=>{const ax=Math.sign(sx-tx),ay=Math.sign(sy-ty);return(ax&&map[ty][tx+ax]==='c')||(ay&&map[ty+ay][tx]==='c')};
function after(){if(alertLv()>=2&&!h2){h2=1;heat=Math.min(5,heat+1)}recalc();hud();acts()}
function walk(p){const s=sd>0;if(s)rb(P.x,P.y);for(const[x,y]of p){P.x=x;P.y=y;if(sd>0){sd--;rb(x,y)}else ap--;if(map[y][x]==='+')doors[x+','+y]=1;
 items=items.filter(i=>{if(i.x===x&&i.y===y){eddies+=i.v;say('Stash: '+i.v+' eddies.');return false}return true});
 if(!core&&vaultOpen&&x===10&&y===11){core=1;say('The core hums. A voice: "Do not put me back in the cold."')}}
 if(s&&sd<=0)say('Time snaps back.');if(core&&P.x===1&&P.y===1){end('win');return}after()}
function click(x,y){if(busy||over||x<0||y<0||x>=W||y>=H)return;
 const g=guards.find(g=>g.hp>0&&g.x===x&&g.y===y&&(vis[y][x]||optics)),c=cams.find(c=>c.x===x&&c.y===y&&c.off<900&&seen[y][x]);
 if(mode==='move'){if(ap<1&&sd<1)return;const p=findPath(P.x,P.y,x,y);if(p&&p.length&&p.length<=(sd>0?sd:ap))walk(p);return}
 if(ap<1)return;const d=Math.hypot(x-P.x,y-P.y);
 if(mode==='shoot'){if(!(g||c)||d>b.rg||!los(P.x,P.y,x,y)){say('No clean shot.');after();return}ap--;noise(P.x,P.y,b.noise);tracer(P.x,P.y,x+(Math.random()-.5)*.4,y+(Math.random()-.5)*.4,b.hack?'#9ff':'#ffd23f');shake=Math.max(shake,3);
  if(c){if(Math.random()<.7){c.off=999;say('Camera dead.')}else say('Missed the camera.');after();return}
  let ch=b.acc-(covered(x,y,P.x,P.y)?(b.hack?.25:.12):0)-(hum<40?.1:0);
  if(Math.random()<ch){let dm=b.dmg*(b.ch&&Math.random()<.25?2:1);g.hp-=dm;spark(x*T+16,y*T+16,'#ff2e5a',12);num(x,y,'-'+dm,'#ff2e5a');g.st=2;g.tgt={x:P.x,y:P.y};g.sus=6;
   say(g.hp<=0?'Guard down. Quiet, finally.':'Hit. He drops cover and limps.')}else{say('Missed. He knows where you are.');num(x,y,'miss','#aab');g.st=Math.max(g.st,1);g.tgt={x:P.x,y:P.y};g.sus=5}
  after();return}
 if(mode==='blade'){if(!g||d>1.5){say('Nothing in reach.');after();return}ap--;
  slash(x,y);spark(x*T+16,y*T+16,'#ff2e93',14);shake=Math.max(shake,5);if(g.st<2){g.hp=0;say('Mantis blades, from behind. He never made a sound.')}else{g.hp-=3;noise(P.x,P.y,6);say(g.hp<=0?'He goes down hard.':'Blade bites. He screams.')}after();return}
 if(mode==='hack'){if(!(g||c)||d>7||bat<12){say(bat<12?'Battery too low.':'No target in range.');after();return}ap--;bat-=12;tracer(P.x,P.y,x,y,'#2ee6ff');spark(x*T+16,y*T+16,'#2ee6ff',12);
  if(c){c.off=6;say('Camera looped for six turns.')}else{g.stun=3;say('Smartlink fried. He is frozen for three turns.')}after()}}
function jackIn(){if(!b.hack||vaultOpen||ap<1||bat<20||Math.hypot(P.x-9,P.y-9)>8)return;bat-=20;jack=2;spark(P.x*T+16,P.y*T+16,'#2ee6ff',26);shake=6;say('You jack in. The world goes white.');ap=0;endTurn()}
function breach(){if(b.hack||vaultOpen||ap<2||Math.abs(P.x-9)+Math.abs(P.y-9)!==1)return;ap-=2;spark(9*T+16,9*T+16,'#ffb020',44);shake=16;openVault();noise(9,9,14);lockT=3;heat=Math.min(5,heat+2);say('BOOM. The vault is open, and so is the district.');after()}
function sande(){if(b.hack||sd>0||cd>0||ap<3||over)return;ap-=3;sd=9;hum-=10;cd=4;heat=Math.min(5,heat+1);mode='move';shake=10;rb(P.x,P.y);say('Sandevistan. Time stops: nine free squares, nobody else moves.');after()}
function openVault(){map[9][9]='.';vaultOpen=1}
function shootP(g){tracer(g.x,g.y,P.x,P.y,'#ff5a5a');let c=.62-(covered(P.x,P.y,g.x,g.y)?.25:0)+(jack>0?.2:0);
 if(Math.random()<c){const dm=Math.max(1,(jack>0?5:3)-b.ar);P.hp-=dm;flash=10;shake=9;spark(P.x*T+16,P.y*T+16,'#2ee6ff',12);num(P.x,P.y,'-'+dm,'#ff2e5a');say('You take '+dm+'. Chrome does not fix that.');if(P.hp<=0)end('dead')}else say('A round chews the wall beside you.')}
function moveG(g,tx,ty,n){for(let i=0;i<n;i++){const p=findPath(g.x,g.y,tx,ty);if(!p||!p.length)break;const[nx,ny]=p[0];
 if((nx===P.x&&ny===P.y)||!pass(nx,ny))break;g.d=dirOf(nx-g.x,ny-g.y);g.x=nx;g.y=ny;if(map[ny][nx]==='+')doors[nx+','+ny]=1;if(g.x===tx&&g.y===ty)break}}
function guardAct(g){const d=Math.hypot(P.x-g.x,P.y-g.y),sees=inView(g.x,g.y,DIRS[g.d],P.x,P.y,g.st===2?8:detRange());
 if(g.st===0)for(const o of guards)if(o.hp<=0&&!o.f&&inView(g.x,g.y,DIRS[g.d],o.x,o.y,6)){o.f=1;g.st=1;g.tgt={x:o.x,y:o.y};g.sus=5;say('A guard found a body.')}
 if(sees){const o=g.st;g.st=(g.st>=1||d<=3)?2:1;if(g.st!==o)num(g.x,g.y,g.st===2?'!':'?',g.st===2?'#ff2e5a':'#ffb020');g.tgt={x:P.x,y:P.y};g.sus=6}
 if(g.st===2){if(sees&&d<=7){g.d=dirOf(P.x-g.x,P.y-g.y);shootP(g);return}
  moveG(g,g.tgt.x,g.tgt.y,2);if(!sees&&--g.sus<=0){g.st=1;g.sus=4}return}
 if(g.st===1){if(g.tgt)moveG(g,g.tgt.x,g.tgt.y,1);if(--g.sus<=0){g.st=0;g.tgt=null}return}
 if(g.path.length>1){const[tx,ty]=g.path[g.pi];if(g.x===tx&&g.y===ty)g.pi=(g.pi+1)%g.path.length;moveG(g,...g.path[g.pi],1)}
 else if(turn%2===0)g.d=(g.d+1)%4}
function enemyPhase(){for(const c of cams){if(c.off>0){c.off--;continue}c.i=(c.i+1)%c.v.length;
  if(inView(c.x,c.y,c.v[c.i],P.x,P.y,8)){say('A camera locks onto you. Every guard hears it.');
   if(!c.seen){c.seen=1;heat=Math.min(5,heat+1)}for(const g of guards)if(g.hp>0&&g.stun<=0){g.st=2;g.tgt={x:P.x,y:P.y};g.sus=6}}}
 for(const g of guards){if(g.hp<=0||over)continue;if(g.stun>0){g.stun--;continue}guardAct(g)}
 if(lockT>0&&--lockT===0&&!spawned){spawned=1;for(const[x,y]of[[20,7],[1,7]])if(pass(x,y)){const n=G(x,y,2,[]);n.st=2;n.tgt={x:P.x,y:P.y};n.sus=8;guards.push(n)}say('Lockdown: reinforcements flood the lobby.')}}
function endTurn(){if(over||busy)return;if(sd>0){sd=0;say('Time snaps back.');after();return}enemyPhase();if(over)return;turn++;if(cd>0)cd--;if(optics){bat=Math.max(0,bat-6);if(!bat)optics=false}startTurn()}
function startTurn(){ap=Math.min(5,ap+3);if(hum<40&&Math.random()<(40-hum)/100){ap--;say('Flicker: your hands stop answering for a second.')}
 if(jack>0){jack--;if(jack===0){openVault();say('ICE cracked. The vault door unlocks.')}
  else{ap=0;busy=1;say('Still jacked in. Your body is a sitting target.');after();setTimeout(()=>{busy=0;endTurn()},650);return}}
 after()}
function init(k){b=B[k];map=MAP.map(r=>r.replace('S','.').split(''));P={x:1,y:1,hp:b.hp};hum=b.hum;bat=b.bat;
 guards=[G(8,7,0,[[2,7],[12,7]]),G(10,8,2,[]),G(10,2,1,[]),G(17,3,0,[[15,2],[19,3]])];
 cams=[{x:5,y:6,v:[[-1,0],[1,1]],i:0,off:0,seen:0,cone:[]},{x:16,y:8,v:[[-1,0],[0,-1]],i:0,off:0,seen:0,cone:[]}];
 items=[{x:12,y:1,v:150},{x:20,y:1,v:150}];doors={};seen=MAP.map(r=>[...r].map(()=>0));
 fx=[];sd=0;shake=0;ap=0;turn=1;mode='move';heat=0;logs=[];over=0;core=0;jack=0;cd=0;lockT=0;spawned=0;vaultOpen=0;eddies=0;optics=0;busy=0;h2=0;
 say('Kestrel-Vance tower. Vault is south of the lobby. Get the core, come back to the green ring.');ov.style.display='none';startTurn()}
function end(k){over=1;acts();hud();recalc();
 if(k==='dead')show('<h2>Flatlined</h2><p>Port Meridian holds no funerals, only resales of your chrome.</p><button onclick="menu()">Try again</button>');
 else show('<h2>The voice in the core</h2><p>It is not schematics. It is a person, a whole mind on ice. Your fixer is waiting on the line.</p><button onclick="fin(0)">Deliver it (+500 eddies)</button><button onclick="fin(1)">Free it</button><button onclick="fin(2)">Sell it to a rival (+900 eddies)</button>')}
function fin(i){const t=['The fixer pays. The voice goes quiet in another corp\'s vault, and you sleep badly.','You crack the core. A ghost walks out through the wires. No payout, but the Net now owes you one.','The rival pays triple. Your fixer\'s name lands on a kill list, with yours right under it.'][i];
 const e=eddies+[500,0,900][i],hh=Math.max(0,Math.min(5,heat+(i===0?-1:i===2?1:0)));
 show('<h2>Extracted</h2><p>'+t+'</p><p>Eddies '+e+' / District heat '+hh+' of 5 / Humanity left '+Math.max(0,hum)+' / Turns '+turn+'</p><button onclick="menu()">Run it again</button>')}
function show(h){ov.innerHTML=h;ov.style.display='block'}
function menu(){show('<h2>Wetwire: The Cold Archive</h2><p>Steal the core from the Kestrel-Vance vault and walk it back out. Nobody has a health bar. Watch how they move instead.</p><div class="cards"><div class="card"><b>Ghostwire, netrunner</b><p>Hack cameras, freeze guards, jack into the vault. Jacking takes two turns, and your body is helpless. Silenced pistol, thin skin, Stealth trench.</p><button onclick="init(\'net\')">Jack in</button></div><div class="card"><b>Iron Lung, solo</b><p>Smart SMG, mantis blades, subdermal armor, Sandevistan (3 AP: freeze time, 9 free squares). Breaching the vault is loud and brings a lockdown. Humanity starts low.</p><button onclick="init(\'solo\')">Deploy</button></div></div>')}
function hud(){const a=alertLv(),AL=['Cold','Suspicious','Hunting','Lockdown'],pips=(n,m,c)=>Array.from({length:m},(_,i)=>'<span class="pip '+c+(i<n?' on':'')+'"></span>').join('');
 const hc=hum<20?'#ff2e93':hum<40?'#ffb020':'#2ee6ff',hl=hum<20?' Cyberpsychosis':hum<40?' Flicker':'';
 document.getElementById('hud').innerHTML='<div class="st">HP '+pips(Math.max(0,P.hp),b.hp,'hp')+'</div><div class="st">AP '+pips(Math.max(0,ap),5,'')+'</div>'+
 '<div class="st">Humanity <div class="bar"><i style="width:'+Math.max(0,hum)+'%;background:'+hc+'"></i></div>'+hl+'</div><div class="st">Battery <div class="bar"><i style="width:'+bat+'%;background:#2ee6ff"></i></div></div>'+
 '<div class="st">Alert <b style="color:'+['#2ee6ff','#ffb020','#ff2e93','#ff2e93'][a]+'">'+AL[a]+'</b></div><div class="st">Heat '+pips(heat,5,'ht')+'</div><div class="st">Eddies '+eddies+'</div>'+(sd>0?'<div class="st" style="color:#ff2e93">Time frozen: '+sd+' squares left</div>':'');
 document.getElementById('log').innerHTML=logs.map(l=>'<div>'+l+'</div>').join('')}
function acts(){const nearV=Math.hypot(P.x-9,P.y-9);const bt=(l,f,dis,on)=>'<button '+(dis?'disabled ':'')+(on?'class="on" ':'')+'onclick="'+f+'">'+l+'</button>';
